name: WE11DONE
description: 'WE11DONE (pronounced "well done") is a Seoul-based fashion label founded in 2015 by
  Dami Kwon and Jessica Jung, the duo behind the Seoul concept boutique Rare Market. The brand fuses
  late-1990s and early-2000s streetwear and athleisure aesthetics into a globally distributed designer
  ready-to-wear line, sold through its own e-commerce storefront at we11-done.com and stockists worldwide.
  Surfaced as a consumer-sector portfolio company of hongshan and added to the API Evangelist network as
  a lead. An enrichment pass on 2026-07-21 confirmed the company operates a direct-to-consumer retail
  website but publishes no developer API surface: no developer portal, API reference, well-known metadata,
  or llms.txt were found.'
